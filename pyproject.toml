[build-system]
requires = ["poetry-core==2.4.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "aart-cli-telemetry-server"
version = "0.1.0"
description = "Receives aart-cli's artifact telemetry, stores it in SQLite and shows it on a dashboard."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
authors = [{ name = "Michał Filek" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "returns (>=0.26)",
    "sqlalchemy (>=2.0,<3)",
    "pydantic (>=2.9,<3)",
]

[project.scripts]
aart-cli-telemetry-server = "aart_cli_telemetry_server.cli:main"

[project.urls]
Repository = "https://github.com/M1F1/aart-cli-telemetry-server"

[project.optional-dependencies]
postgresql = ["psycopg[binary] (>=3.2,<4)"]

[tool.poetry]
packages = [{ include = "aart_cli_telemetry_server" }]
include = [
    { path = "aart_cli_telemetry_server/web/static/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = ">=0.27,<1"
hypothesis = "^6.165"
ruff = "0.16.4"
mypy = "^1.11"
mutmut = { version = "^3.7", python = ">=3.11,<4.0" }
tach = "0.35.3"
coverage = ">=7.6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RET", "PT", "PL", "RUF"]
ignore = ["PLR0911", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104"]
# The image check drives docker and the published port: those are what it checks.
"scripts/**" = ["S101", "S310", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy", "returns.contrib.mypy.returns_plugin"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
branch = true
source = ["aart_cli_telemetry_server"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise AssertionError"]

[tool.mutmut]
source_paths = ["aart_cli_telemetry_server/domain/", "aart_cli_telemetry_server/application/"]
also_copy = ["aart_cli_telemetry_server/", "contract/", "docs/"]
pytest_add_cli_args_test_selection = ["tests/test_contract.py", "tests/test_stats.py", "tests/test_use_cases.py"]
# tach's pytest plugin leaves threads behind that deadlock mutmut's forked workers on macOS: every
# mutant then times out. The architecture is checked by `tach check`, not by this run.
pytest_add_cli_args = ["-p", "no:tach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
