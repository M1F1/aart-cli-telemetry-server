name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# What a copy of this repository differs in is a variable of its own (Settings, Secrets and
# variables, Actions), with this repository's value as the fallback; README.md, "Your
# organisation's copy", lists them. A secret is named by a variable, never read by a fixed name.
#
# Every job runs on the runner, which needs Docker and python3 3.8 or later. Each image a job
# uses is pulled first by scripts/registry_image.py with credentials of its own, or with none, and
# the checks run in a CI image by scripts/check_in_image.py. The jobs use no `container:` or
# `services:`, whose one `credentials` block per image cannot be left out where none is named.
env:
  AART_CLI_TELEMETRY_INDEX_URL: ${{ vars.AART_CLI_TELEMETRY_PIP_INDEX_URL || 'https://pypi.org/simple' }}
  AART_CLI_TELEMETRY_INDEX_CREDENTIALS: ${{ secrets[vars.AART_CLI_TELEMETRY_PIP_INDEX_CREDENTIALS_SECRET_NAME] }}
  AART_CLI_TELEMETRY_PYTHON: ${{ vars.AART_CLI_TELEMETRY_PYTHON || 'python' }}
  AART_CLI_TELEMETRY_PYTHON_IMAGE: ${{ vars.AART_CLI_TELEMETRY_PYTHON_IMAGE || 'python:3.13-slim-bookworm' }}
  AART_CLI_TELEMETRY_POSTGRES_IMAGE: ${{ vars.AART_CLI_TELEMETRY_POSTGRES_IMAGE || 'postgres:16' }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore

jobs:
  quality:
    runs-on: ${{ fromJSON(vars.AART_CLI_TELEMETRY_RUNNER || '["ubuntu-latest"]') }}
    strategy:
      matrix:
        image: ${{ fromJSON(vars.AART_CLI_TELEMETRY_CI_IMAGES || '["python:3.13", "python:3.11"]') }}
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pip-index
      - name: Pull the CI image
        env:
          AART_CLI_TELEMETRY_CI_IMAGES_USERNAME: ${{ secrets[vars.AART_CLI_TELEMETRY_CI_IMAGES_USERNAME_SECRET_NAME] }}
          AART_CLI_TELEMETRY_CI_IMAGES_PASSWORD: ${{ secrets[vars.AART_CLI_TELEMETRY_CI_IMAGES_PASSWORD_SECRET_NAME] }}
        run: python3 scripts/registry_image.py pull AART_CLI_TELEMETRY_CI_IMAGES "$IMAGE"
      - run: python3 scripts/check_in_image.py "$IMAGE" -- scripts/quality.py

  # The first CI image runs the PostgreSQL check.
  postgresql:
    runs-on: ${{ fromJSON(vars.AART_CLI_TELEMETRY_RUNNER || '["ubuntu-latest"]') }}
    env:
      IMAGE: ${{ fromJSON(vars.AART_CLI_TELEMETRY_CI_IMAGES || '["python:3.13", "python:3.11"]')[0] }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pip-index
      - name: Pull the CI image
        env:
          AART_CLI_TELEMETRY_CI_IMAGES_USERNAME: ${{ secrets[vars.AART_CLI_TELEMETRY_CI_IMAGES_USERNAME_SECRET_NAME] }}
          AART_CLI_TELEMETRY_CI_IMAGES_PASSWORD: ${{ secrets[vars.AART_CLI_TELEMETRY_CI_IMAGES_PASSWORD_SECRET_NAME] }}
        run: python3 scripts/registry_image.py pull AART_CLI_TELEMETRY_CI_IMAGES "$IMAGE"
      - name: Pull the PostgreSQL image
        env:
          AART_CLI_TELEMETRY_POSTGRES_IMAGE_USERNAME: ${{ secrets[vars.AART_CLI_TELEMETRY_POSTGRES_IMAGE_USERNAME_SECRET_NAME] }}
          AART_CLI_TELEMETRY_POSTGRES_IMAGE_PASSWORD: ${{ secrets[vars.AART_CLI_TELEMETRY_POSTGRES_IMAGE_PASSWORD_SECRET_NAME] }}
        run: python3 scripts/registry_image.py pull AART_CLI_TELEMETRY_POSTGRES_IMAGE "$AART_CLI_TELEMETRY_POSTGRES_IMAGE"
      - run: >-
          python3 scripts/check_in_image.py "$IMAGE" --postgres "$AART_CLI_TELEMETRY_POSTGRES_IMAGE"
          -- -m pytest -q tests/test_repository_contract.py

  image:
    runs-on: ${{ fromJSON(vars.AART_CLI_TELEMETRY_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        env:
          AART_CLI_TELEMETRY_PYTHON_IMAGE_USERNAME: ${{ secrets[vars.AART_CLI_TELEMETRY_PYTHON_IMAGE_USERNAME_SECRET_NAME] }}
          AART_CLI_TELEMETRY_PYTHON_IMAGE_PASSWORD: ${{ secrets[vars.AART_CLI_TELEMETRY_PYTHON_IMAGE_PASSWORD_SECRET_NAME] }}
          AART_CLI_TELEMETRY_POSTGRES_IMAGE_USERNAME: ${{ secrets[vars.AART_CLI_TELEMETRY_POSTGRES_IMAGE_USERNAME_SECRET_NAME] }}
          AART_CLI_TELEMETRY_POSTGRES_IMAGE_PASSWORD: ${{ secrets[vars.AART_CLI_TELEMETRY_POSTGRES_IMAGE_PASSWORD_SECRET_NAME] }}

  # Only from main, only once every check passed, and only where a registry is named. The image
  # is built and checked again here, as `image` does, so what is pushed is what was checked.
  publish:
    needs: [quality, postgresql, image]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.AART_CLI_TELEMETRY_IMAGE_REGISTRY != ''
    runs-on: ${{ fromJSON(vars.AART_CLI_TELEMETRY_RUNNER || '["ubuntu-latest"]') }}
    env:
      REGISTRY: ${{ vars.AART_CLI_TELEMETRY_IMAGE_REGISTRY }}
      REPOSITORY: ${{ vars.AART_CLI_TELEMETRY_IMAGE_REPOSITORY || 'aart-cli-telemetry-server' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image
        env:
          AART_CLI_TELEMETRY_PYTHON_IMAGE_USERNAME: ${{ secrets[vars.AART_CLI_TELEMETRY_PYTHON_IMAGE_USERNAME_SECRET_NAME] }}
          AART_CLI_TELEMETRY_PYTHON_IMAGE_PASSWORD: ${{ secrets[vars.AART_CLI_TELEMETRY_PYTHON_IMAGE_PASSWORD_SECRET_NAME] }}
          AART_CLI_TELEMETRY_POSTGRES_IMAGE_USERNAME: ${{ secrets[vars.AART_CLI_TELEMETRY_POSTGRES_IMAGE_USERNAME_SECRET_NAME] }}
          AART_CLI_TELEMETRY_POSTGRES_IMAGE_PASSWORD: ${{ secrets[vars.AART_CLI_TELEMETRY_POSTGRES_IMAGE_PASSWORD_SECRET_NAME] }}
      # Signed in only inside scripts/registry_image.py, in a Docker configuration of its own under
      # the job's temporary directory, so the runner's own configuration never holds the password.
      - name: Push the checked image
        env:
          AART_CLI_TELEMETRY_IMAGE_USERNAME: ${{ secrets[vars.AART_CLI_TELEMETRY_IMAGE_USERNAME_SECRET_NAME] }}
          AART_CLI_TELEMETRY_IMAGE_PASSWORD: ${{ secrets[vars.AART_CLI_TELEMETRY_IMAGE_PASSWORD_SECRET_NAME] }}
        run: |
          set -euo pipefail
          tags=()
          for tag in "sha-${GITHUB_SHA::12}" main; do
            docker tag aart-cli-telemetry-server:ci "$REGISTRY/$REPOSITORY:$tag"
            tags+=("$REGISTRY/$REPOSITORY:$tag")
          done
          python3 scripts/registry_image.py push AART_CLI_TELEMETRY_IMAGE "${tags[@]}"
          echo "published $REGISTRY/$REPOSITORY:sha-${GITHUB_SHA::12}"
