name: install
description: >
  Install what poetry.lock pins, every hash checked, and this package, with pip from this copy's
  index. Its own action because each check runs as two jobs, with and without credentials for the
  image it runs in, and a step copied is a step that drifts.

runs:
  using: composite
  steps:
  - uses: ./.github/actions/pip-index
  # pip rather than Poetry, so the index is a variable rather than a source edited into
  # pyproject.toml (scripts/locked_requirements.py).
  - name: Install what poetry.lock pins
    shell: bash
    run: |
      set -euo pipefail
      "$AART_CLI_TELEMETRY_PYTHON" scripts/locked_requirements.py main dev > "$RUNNER_TEMP/requirements.txt"
      "$AART_CLI_TELEMETRY_PYTHON" -m pip install --require-hashes --no-deps --requirement "$RUNNER_TEMP/requirements.txt"
      "$AART_CLI_TELEMETRY_PYTHON" -m pip install --no-deps --editable .
