name: image
description: >
  Build the image as `aart-cli-telemetry-server:ci` from this copy's base image and index, and
  check it the way a deployment uses it. One action, so the image a job publishes is built and
  checked exactly as the one every pull request checks.

runs:
  using: composite
  steps:
  - uses: ./.github/actions/pip-index
  # Each image is pulled with its own credentials, which the calling step's environment holds
  # (scripts/registry_image.py), so the build and the check pull nothing themselves: with Docker's
  # default builder, `FROM` uses the base image already pulled.
  - name: Pull the base image
    shell: bash
    run: python3 scripts/registry_image.py pull AART_CLI_TELEMETRY_PYTHON_IMAGE "$AART_CLI_TELEMETRY_PYTHON_IMAGE"
  - name: Pull the PostgreSQL image the check runs
    shell: bash
    run: python3 scripts/registry_image.py pull AART_CLI_TELEMETRY_POSTGRES_IMAGE "$AART_CLI_TELEMETRY_POSTGRES_IMAGE"
  # The index reaches the build as the `pip-index` secret, present only while pip runs, so neither
  # it nor its credentials are in a layer.
  - name: Build the image
    shell: bash
    run: >-
      docker build --build-arg PYTHON_IMAGE="$AART_CLI_TELEMETRY_PYTHON_IMAGE"
      --secret id=pip-index,env=PIP_INDEX_URL --tag aart-cli-telemetry-server:ci .
  - name: Check the image
    shell: bash
    run: python3 scripts/image_smoke.py aart-cli-telemetry-server:ci
